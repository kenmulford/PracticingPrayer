# .NET bindings read public fields over JNI, which R8 cannot see; the SDK's proguard_xamarin.cfg member rule without allowoptimization.
-keepclassmembers,allowshrinking class ** { public protected <fields>; }
# Java never writes changeFlags, so shrinking removes it while the binding still reads it.
-keepclassmembers class androidx.recyclerview.widget.RecyclerView$ItemAnimator$ItemHolderInfo { public int changeFlags; }
